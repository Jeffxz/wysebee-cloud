# Self-hosted Wysebee Cloud: your own server, no Auth0 and no extensions (docs/self-hosting.md).
#   ./scripts/selfhost.sh          # the first time: walks you through it, then starts it
#   (or by hand: cp .env.selfhost.example .env.selfhost, fill it in, then
#    docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build)
#   → http://localhost:8000
#
# Every request is the one owner (WYSEBEE_SELFHOST_USER_*). Without WYSEBEE_SELFHOST_TOKEN anyone
# who can reach the port is that owner, so the port is published on 127.0.0.1 only. To pair agents
# on other devices (a phone, another PC), set a token AND publish it wider (WEB_BIND=0.0.0.0),
# ideally behind HTTPS.
# Its own project, so it never touches the development stack (docker-compose.yml) in the same checkout.
name: wysebee-selfhost

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wysebee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: ${POSTGRES_DB:-wysebee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WYSEBEE_EDITION: selfhost
      WYSEBEE_SELFHOST_TOKEN: ${WYSEBEE_SELFHOST_TOKEN:-}
      WYSEBEE_SELFHOST_USER_NAME: ${WYSEBEE_SELFHOST_USER_NAME:-Owner}
      WYSEBEE_SELFHOST_USER_EMAIL: ${WYSEBEE_SELFHOST_USER_EMAIL:-}
      WYSEBEE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wysebee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wysebee}
      WYSEBEE_LOG_LEVEL: ${WYSEBEE_LOG_LEVEL:-info}
      # The key the passwords of agents' database connections are sealed under: 32 random
      # bytes, base64 (`openssl rand -base64 32`). Keep it: losing it loses those passwords.
      WYSEBEE_AI_KEK: ${WYSEBEE_AI_KEK:?set WYSEBEE_AI_KEK in .env.selfhost (openssl rand -base64 32)}
      # Its address as agents and AI apps reach it, e.g. https://wysebee.example.com.
      WYSEBEE_PUBLIC_URL: ${WYSEBEE_PUBLIC_URL:-}
      WYSEBEE_ASSET_STORE: file
      WYSEBEE_ASSET_DIR: /data/assets
      WYSEBEE_SKILL_FILE_DIR: /data/user-skills
      WYSEBEE_WORKSPACE_DIR: /data/user-workspaces
      WYSEBEE_RECORDING_DIR: /data/browser-recordings
    volumes:
      - assets:/data/assets
      - user-skills:/data/user-skills
      - user-workspaces:/data/user-workspaces
      - recordings:/data/browser-recordings
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"

volumes:
  pgdata:
  assets:
  user-skills:
  user-workspaces:
  recordings:
